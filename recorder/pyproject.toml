[project]
name = "runshape-recorder"
version = "0.1.0"
description = "pytest plugin that records execution traces for the Runshape viewer"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]

[project.scripts]
runshape-review = "runshape_recorder.review:main"

[project.entry-points.pytest11]
runshape = "runshape_recorder.pytest_plugin"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runshape_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
