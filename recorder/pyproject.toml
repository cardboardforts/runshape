[project]
name = "hexvis-recorder"
version = "0.1.0"
description = "pytest plugin that records execution traces for the HexVis viewer"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]

[project.scripts]
hexvis-review = "hexvis_recorder.review:main"

[project.entry-points.pytest11]
hexvis = "hexvis_recorder.pytest_plugin"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexvis_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
